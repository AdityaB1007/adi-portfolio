<text x="550.0" y="78" font-family="Arial, sans-serif" font-size="18" fill="#d6e1c8" text-anchor="middle" font-weight="400">(Buildium)</text>
<text x="262" y="114" font-family="Arial, sans-serif" font-size="18" fill="#e6edde" text-anchor="start" font-weight="400">• Property &amp; Unit Directory</text>
