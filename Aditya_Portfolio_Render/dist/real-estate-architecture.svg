<text x="262" y="204" font-family="Arial, sans-serif" font-size="18" fill="#e6edde" text-anchor="start" font-weight="400">• Maintenance &amp; Resident Requests</text>
<text x="262" y="234" font-family="Arial, sans-serif" font-size="18" fill="#e6edde" text-anchor="start" font-weight="400">• General Ledger Balances &amp; Late Fees</text>
