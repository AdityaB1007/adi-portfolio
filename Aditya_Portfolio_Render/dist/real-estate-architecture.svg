<text x="452" y="1134" font-family="Arial, sans-serif" font-size="18" fill="#e6edde" text-anchor="start" font-weight="400">• Centralized Signed PDF Vault</text>
<text x="452" y="1164" font-family="Arial, sans-serif" font-size="18" fill="#e6edde" text-anchor="start" font-weight="400">• Direct 1-Click Access Links Stamped in Sheet</text>
<path d="M755 1190V1235" stroke="#c7ed8a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="780" y="1219" font-family="Arial, sans-serif" font-size="16" fill="#c7ed8a" text-anchor="start" font-weight="400">Cloud File Link Attached</text>
