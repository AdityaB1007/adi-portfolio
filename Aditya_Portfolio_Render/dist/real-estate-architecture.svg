<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1530" role="img" aria-labelledby="title desc"><title id="title">Real estate operations architecture</title><desc id="desc">Buildium syncs to a Google Workspace hub containing Leasing and Units, Applicant Pipeline, and Late Rent Ledger. Leasing and Units syncs directly to Jira. Applicant Pipeline dispatches contracts to PandaDoc. Executed PDFs are archived in Google Drive, with file links attached to Jira.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c7ed8a"/></marker></defs><rect width="1100" height="1530" fill="#172013"/>
<rect x="240" y="20" width="620" height="245" rx="6" fill="#202c19" stroke="#809263"/>
