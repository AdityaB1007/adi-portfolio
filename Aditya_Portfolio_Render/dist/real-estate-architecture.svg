<text x="550.0" y="1267" font-family="Arial, sans-serif" font-size="20" fill="#d3f79c" text-anchor="middle" font-weight="700">PROJECT MANAGEMENT &amp; TEAM WORKFLOW</text>
<text x="550.0" y="1293" font-family="Arial, sans-serif" font-size="18" fill="#d6e1c8" text-anchor="middle" font-weight="400">(Jira Kanban)</text>
<text x="42" y="1329" font-family="Arial, sans-serif" font-size="18" fill="#e6edde" text-anchor="start" font-weight="400">• Visual Unit Pipeline: Vacant ➔ Renovation ➔ In Eviction ➔ Rented</text>
<text x="42" y="1359" font-family="Arial, sans-serif" font-size="18" fill="#e6edde" text-anchor="start" font-weight="400">• Auto-Prioritization: Lease expiration math dynamically sets card urgency</text>
